<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameVibeStory</title>
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/win95.css">
  <link rel="stylesheet" href="css/apps.css">
</head>
<body>
  <div id="screen" class="theme-win95">
    <div class="desktop" id="desktop">
      <div class="desk-icons" id="desk-icons"></div>
    </div>
    <div class="windows" id="windows"></div>
    <div class="toasts" id="toasts"></div>
    <div class="taskbar hidden" id="taskbar"></div>
    <div id="start-menu" class="start-menu hidden"></div>
    <div id="modals"></div>
    <div id="fullscreen"></div>

  </div>
  <div id="crt"><div class="crt-scan"></div><div class="crt-mask"></div><div class="crt-noise"></div><div class="crt-flicker"></div><div class="crt-glass"></div><div class="crt-power"></div></div>
  <script type="module" src="js/main.js"></script>

</html>
